[package]
name = "dashkey-host"
version = "0.1.0"
edition = "2021"
description = "DashKey Host - Remote control panel server (Stream Deck via smartphone)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false }
sha2 = "0.10"
hostname = "0.4"
local-ip-address = "0.6"
rodio = "0.22.2"
obws = "0.15.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
eframe = "0.33"
auto-launch = "0.6"
rfd = "0.15"
base64 = "0.22"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }

[target.'cfg(windows)'.dependencies]
enigo = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.3", features = ["x11rb"] }

[profile.release]
lto = "thin"
strip = true

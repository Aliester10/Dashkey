[package]
name = "dashkey-gui"
version = "0.1.0"
edition = "2021"
description = "DashKey GUI (Tauri) - desktop control panel untuk DashKey Host"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dashkey-host = { path = "../..", default-features = false }

[profile.release]
lto = "thin"
strip = true
